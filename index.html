<style>
:root{
  --grond:#17181D; --vlak:#22242C; --vlak2:#2C2F39; --lijn:#3A3E4A; --lijn2:#2F323C;
  --inkt:#F2EDE4; --stil:#A7A6B0; --stil2:#CFCBD4; --dof:#6E6B76;
  --amber:#E8A55B; --amber-inkt:#1B1408; --bakrand:#4A4436; --warm:#E8C79E;
  --titel:'Sora', system-ui, sans-serif; --tekst:'Atkinson Hyperlegible', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--grond);color:var(--inkt);font-family:var(--tekst);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{max-width:480px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--titel);font-weight:700;font-size:30px;letter-spacing:-.5px;margin:0;line-height:1.15}
h2{font-family:var(--titel);font-weight:600;font-size:18px;margin:0}
.kop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rij{display:flex;gap:8px;align-items:center}
.stil{color:var(--stil)} .klein{font-size:13px} .fijn{font-size:14px}
.verborgen{display:none!important}
.kaart{background:var(--vlak);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
a.kaart{text-decoration:none}
.kaart.bak{border:1.5px solid var(--bakrand)}
.label{font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--stil);text-transform:uppercase}
.label.warm{color:var(--warm)}
.knop{min-height:48px;border-radius:14px;border:0;background:var(--inkt);color:var(--grond);font-weight:700;font-size:15px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center;white-space:nowrap}
.knop svg{flex-shrink:0}

<body>
<div id="app"></div>
<div id="toast" class="toast verborgen" role="status" aria-live="polite"><span id="toast-tekst"></span><button id="toast-knop" type="button">Ongedaan</button></div>
<input type="file" id="bestand" accept="application/json,.json" class="verborgen">
<input type="file" id="foto-in" accept="image/*" capture="environment" class="verborgen">
<script>
'use strict';
/* Atelier v1 · alles staat lokaal op dit toestel (localStorage + IndexedDB) */
const OPSLAG = 'atelier_v1';
const DAG = 864e5;
const SOORT = {
  muziek:{ naam:'Muziek', kleur:'#7FB8E0' }, comedy:{ naam:'Comedy', kleur:'#E58A6E' },
  schrijven:{ naam:'Schrijven', kleur:'#B9A6E8' }, overig:{ naam:'Overig', kleur:'#A7A6B0' }
};
const IDEESOORT = { riff:{ naam:'Riff', soort:'muziek' }, grap:{ naam:'Grap', soort:'comedy' }, tekst:{ naam:'Tekst', soort:'schrijven' }, idee:{ naam:'Idee', soort:'overig' } };
const SOORT_NAAR_IDEE = { muziek:'riff', comedy:'grap', schrijven:'tekst', overig:'idee' };
const SJABLONEN = {
  band:{ naam:'Optreden met een band', statussen:['nieuw','ken ik','zit erin'], onderdeel:'nummer', meer:'nummers', groep:'Blok', soort:'muziek', duur:false },
  muziek:{ naam:'Eigen muziek', statussen:['idee','demo','arrangement','opgenomen','af'], onderdeel:'nummer', meer:'nummers', groep:'Groep', soort:'muziek', duur:false },
  comedy:{ naam:'Comedyset', statussen:['idee','geschreven','getest','werkt'], onderdeel:'bit', meer:'bits', groep:'Deel', soort:'comedy', duur:true },
  schrijven:{ naam:'Schrijfproject', statussen:['idee','klad','herschreven','af'], onderdeel:'stuk', meer:'stukken', groep:'Deel', soort:'schrijven', duur:false },
  leeg:{ naam:'Leeg', statussen:['open','bezig','klaar'], onderdeel:'onderdeel', meer:'onderdelen', groep:'Groep', soort:null, duur:false }
};
const LADDER = {
  comedy:['Hardop voor jezelf','Opnemen en terugluisteren','Aan één vriend','Open mic'],
  standaard:['Voor jezelf, hardop of gespeeld','Opnemen en terugluisteren','Laten horen aan één persoon','Voor een klein publiek','Op een podium']
};
const VERDELING = { 15:[3,8,4], 30:[5,15,10], 45:[5,25,15] };

function nu(){ return Date.now(); }
function nieuwId(){ return Math.random().toString(36).slice(2,9) + nu().toString(36).slice(-3); }
function pad(n){ return String(n).padStart(2,'0'); }
function dagSleutel(ts){ const d = new Date(ts ?? nu()); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function vanSleutel(s){ const [y,m,d] = String(s).split('-').map(Number); return new Date(y, (m||1)-1, d||1); }
function plusDagen(s, n){ const d = vanSleutel(s); d.setDate(d.getDate() + n); return dagSleutel(d.getTime()); }
const DAGEN = ['zo','ma','di','wo','do','vr','za'];
const MAANDEN = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const MAANDEN_LANG = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
function datumKort(s){ const d = vanSleutel(s); return DAGEN[d.getDay()] + ' ' + d.getDate() + ' ' + MAANDEN[d.getMonth()]; }
function datumLang(s){ const d = vanSleutel(s); return DAGEN[d.getDay()] + ' ' + d.getDate() + ' ' + MAANDEN_LANG[d.getMonth()]; }
function dagenTot(s){ return Math.round((vanSleutel(s) - vanSleutel(dagSleutel())) / DAG); }
function dagenGeleden(ts){ return Math.round((vanSleutel(dagSleutel()) - vanSleutel(dagSleutel(ts))) / DAG); }
function rel(ts){
  const d = dagenGeleden(ts);
  if (d <= 0) return 'vandaag'; if (d === 1) return 'gisteren'; if (d < 7) return d + ' dagen';
  if (d < 30) { const w = Math.round(d/7); return w === 1 ? '1 week' : w + ' weken'; }
  if (d < 365) { const m = Math.round(d/30); return m === 1 ? '1 maand' : m + ' maanden'; }
  const j = Math.round(d/365); return j === 1 ? '1 jaar' : j + ' jaar';
}
function relZin(ts){ const r = rel(ts); return (r === 'vandaag' || r === 'gisteren') ? r : r + ' geleden'; }
function sec(s){ s = Math.max(0, Math.round(s || 0)); return Math.floor(s/60) + ':' + pad(s % 60); }
function uur(ts){ const d = new Date(ts); return d.getHours() + 'u' + pad(d.getMinutes()); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function klein1(s){ s = String(s || ''); return s.charAt(0).toLowerCase() + s.slice(1); }
function groot1(s){ s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }
const $ = s => document.querySelector(s);

/* ---------- toestand ---------- */
function startToestand(){
  return {
    versie:1, ideeen:[], projecten:[],
    disciplines:[
      { id:'bas', naam:'Bas', soort:'muziek' }, { id:'gitaar', naam:'Gitaar', soort:'muziek' }, { id:'zang', naam:'Zang', soort:'muziek' },
      { id:'comedy', naam:'Comedy', soort:'comedy' }, { id:'schrijven', naam:'Schrijven', soort:'schrijven' }
    ],
    uitDeBak:'dag', bakVandaag:null, schermAan:true, sessie:null, sessies:[],
    laatsteMin:30, laatsteDisc:null, laatsteBackup:null, laatsteMediaBackup:null, sinds:nu()
  };
}
let S;
function laad(){
  try { const r = localStorage.getItem(OPSLAG); if (r) { S = Object.assign(startToestand(), JSON.parse(r)); return; } } catch(e) {}
  S = startToestand(); bewaar();
}
function bewaar(){ try { localStorage.setItem(OPSLAG, JSON.stringify(S)); } catch(e) { toast('Opslaan lukt niet: is je telefoon vol?'); } }

function vindIdee(id){ return S.ideeen.find(i => i.id === id); }
function vindProject(id){ return S.projecten.find(p => p.id === id); }
function vindDeel(p, id){ return p ? p.onderdelen.find(o => o.id === id) : null; }
function vindDisc(id){ return S.disciplines.find(d => d.id === id); }
function discNaam(id){ if (id === 'vrij') return 'Zonder doel'; const d = vindDisc(id); return d ? d.naam : 'Zonder discipline'; }
function discSoort(id){ const d = vindDisc(id); return d ? d.soort : 'overig'; }
function projectSoort(p){ return p.disc && vindDisc(p.disc) ? discSoort(p.disc) : (SJABLONEN[p.sjabloon]?.soort || 'overig'); }
function kleur(soort){ return (SOORT[soort] || SOORT.overig).kleur; }
function ideeSoort(i){ if (i.soort && IDEESOORT[i.soort]) return IDEESOORT[i.soort].soort; const p = i.pid && vindProject(i.pid); return p ? projectSoort(p) : 'overig'; }
function ideeTitel(i){
  if (i.tekst && i.tekst.trim()) return i.tekst.trim();
  const wanneer = datumKort(dagSleutel(i.gemaakt)) + ', ' + uur(i.gemaakt);
  return (i.mediaSoort === 'foto' ? 'Foto van ' : i.mediaSoort === 'audio' ? 'Opname van ' : 'Idee van ') + wanneer;
}
function actieveProjecten(){ return S.projecten.filter(p => p.status === 'actief'); }
function inBak(){ return S.ideeen.filter(i => i.status === 'bak'); }
function topStatus(p){ return p.statussen.length - 1; }
function sjab(p){ return SJABLONEN[p.sjabloon] || SJABLONEN.leeg; }

/* ---------- mijlpalen ---------- */
function scopeVan(p, m){ return p.onderdelen.filter(o => !m.groep || o.groep === m.groep); }
function scopeNaam(p, m){ if (!m.groep) return 'alles'; const g = p.groepen.find(x => x.id === m.groep); return g ? klein1(g.naam) : 'alles'; }
function nogTe(p, m){ if (m.min == null) return 0; return scopeVan(p, m).filter(o => o.status < m.min).length; }
function mijlpaalWat(p, m){
  if (m.min == null) return m.wat || 'Mijlpaal';
  const basis = scopeNaam(p, m) + ' minstens ' + (p.statussen[m.min] ?? '?');
  return m.wat ? m.wat + ' (' + basis + ')' : basis;
}
function volgendeMijlpaal(p){
  return p.mijlpalen.filter(m => m.min != null && nogTe(p, m) > 0).sort((a,b) => a.datum < b.datum ? -1 : 1)[0] || null;
}
function gebeurtenissen(p){ const v = dagSleutel(); return p.mijlpalen.filter(m => m.min == null && m.datum >= v).sort((a,b) => a.datum < b.datum ? -1 : 1); }
function aftellen(p){
  const v = dagSleutel(); const toek = p.mijlpalen.filter(m => m.datum >= v).sort((a,b) => a.datum < b.datum ? -1 : 1);
  if (!toek.length) return null;
  const d = dagenTot(toek[toek.length-1].datum);
  if (d < 14) return { getal:d, eenheid: d === 1 ? 'dag' : 'dagen' };
  const w = Math.round(d/7); return { getal:w, eenheid: w === 1 ? 'week' : 'weken' };
}
function mijlpaalRegel(p){
  const m = volgendeMijlpaal(p);
  if (!m) return null;
  const voorbij = m.datum < dagSleutel();
  return { m, voorbij, tekst: datumKort(m.datum) + ': ' + mijlpaalWat(p, m) + ' · nog ' + nogTe(p, m) };
}

/* ---------- media in IndexedDB ---------- */
const MEDIA = (() => {
  let dbp = null;
  function open(){
    if (!dbp) dbp = new Promise((ok, nok) => {
      try {
        const r = indexedDB.open('atelier_media', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('media', { keyPath:'id' });
        r.onsuccess = () => ok(r.result); r.onerror = () => nok(r.error);
      } catch(e) { nok(e); }
    });
    return dbp;
  }
  function tx(mode, f){
    return open().then(db => new Promise((ok, nok) => {
      const t = db.transaction('media', mode); const req = f(t.objectStore('media'));
      t.oncomplete = () => ok(req ? req.result : undefined); t.onerror = () => nok(t.error); t.onabort = () => nok(t.error);
    }));
  }
  return {
    put: rec => tx('readwrite', st => st.put(rec)),
    get: id => tx('readonly', st => st.get(id)),
    alle: () => tx('readonly', st => st.getAll()),
    weg: id => tx('readwrite', st => st.delete(id))
  };
})();
const urlCache = {};
async function mediaUrl(id){
  if (!id) return null; if (urlCache[id]) return urlCache[id];
  try { const r = await MEDIA.get(id); if (!r) return null; return urlCache[id] = URL.createObjectURL(r.blob); } catch(e) { return null; }
}
async function vulFotos(){
  for (const img of document.querySelectorAll('img[data-foto]')) {
    const u = await mediaUrl(img.dataset.foto); if (u) img.src = u; else img.alt = 'foto niet gevonden';
  }
}

/* ---------- afspelen ---------- */
const ICOON = {
  play:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
  pauze:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
  stop:'<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  mic:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  micGroot:'<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  noot:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  terug:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  verder:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>',
  instel:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  link:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7"/><path d="M10 14L21 3"/><path d="M21 14v7H3V3h7"/></svg>',
  foto:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></svg>',
  vink:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>'
};
const speler = new Audio();
let speeltId = null;
speler.onended = () => { speeltId = null; zetSpeelKnoppen(); };
function speelKnop(id, licht){ const aan = speeltId === id; return `<button type="button" class="speel${licht ? ' licht' : ''}" data-doe="speel" data-id="${esc(id)}" aria-label="${aan ? 'Pauze' : 'Afspelen'}">${aan ? ICOON.pauze : ICOON.play}</button>`; }
function zetSpeelKnoppen(){

/* ---------- opnemen ---------- */
const rec = { staat:'uit', ctx:null, mr:null, stream:null, stukjes:[], start:0, blob:null, duur:0, fout:'', naStop:null };

function resetOpname(){
  if (rec.mr && rec.staat === 'neemt') { rec.naStop = null; try { rec.mr.stop(); } catch(e) {} }
  if (rec.stream) rec.stream.getTracks().forEach(t => t.stop());
  if (speeltId === '__rec') stopSpelen();
  Object.assign(rec, { staat:'uit', ctx:null, mr:null, stream:null, stukjes:[], start:0, blob:null, duur:0, fout:'', naStop:null });
}
async function startOpname(ctx){
  resetOpname(); rec.ctx = ctx;

  rec.staat = 'vraagt'; tekenOpname();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    if (rec.ctx !== ctx || rec.staat !== 'vraagt') { stream.getTracks().forEach(t => t.stop()); return; }
    const soort = ['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
    const mr = new MediaRecorder(stream, soort ? { mimeType:soort } : undefined);
    rec.mr = mr; rec.stream = stream; rec.stukjes = [];
    mr.ondataavailable = e => { if (e.data && e.data.size) rec.stukjes.push(e.data); };
    mr.onstop = () => {
      rec.blob = new Blob(rec.stukjes, { type: mr.mimeType || 'audio/webm' });
      rec.duur = Math.max(1, Math.round((nu() - rec.start) / 1000));
      stream.getTracks().forEach(t => t.stop()); rec.stream = null;
      rec.staat = 'klaar';
      const f = rec.naStop; rec.naStop = null;
      if (f) f(); else tekenOpname();
    };
    mr.start(); rec.start = nu(); rec.staat = 'neemt';
  } catch(e) {
    rec.staat = 'uit';
    rec.fout = e && e.name === 'NotAllowedError' ? 'Geen toegang tot de microfoon. Geef Chrome toestemming en probeer opnieuw.' : 'Opnemen lukt nu niet.';

}
function stopOpname(){ if (rec.mr && rec.staat === 'neemt') { try { rec.mr.stop(); } catch(e) { rec.staat = 'uit'; } } }
function opnameInhoud(ctx){

    if (hier && rec.staat === 'klaar' && rec.blob) return `<div class="rij">${speelKnop('__rec', true)}<div class="tijd">${sec(rec.duur)}</div></div><div class="stil fijn">Opname klaar. Geef ze een naam als je wil.</div><button type="button" class="tekstknop" data-doe="neemop" data-ctx="vang">Opnieuw opnemen</button>`;

  }

  if (hier && rec.staat === 'neemt') return `<button type="button" class="rond neemt" data-doe="stopop" aria-label="Stop de opname">${ICOON.stop}</button><div><div class="tijd" id="opname-tijd" style="font-size:22px">${sec((nu()-rec.start)/1000)}</div><div class="stil klein">Tik om te stoppen.</div></div>`;

}

/* ---------- inspreken als tekst ---------- */
let herkenner = null, luistert = false;

function startLuisteren(veldId, opslaan){

  if (!kanSpraak()) { veld.focus(); return; }
  try {
    const R = window.SpeechRecognition || window.webkitSpeechRecognition;
    herkenner = new R(); herkenner.lang = 'nl-BE'; herkenner.interimResults = true; herkenner.continuous = false;
    const basis = veld.value.trim();

      const v = $('#' + veldId); if (!v) return;

    };
    herkenner.onerror = e => { toast(e.error === 'not-allowed' ? 'Geen toegang tot de microfoon.' : e.error === 'no-speech' ? 'Ik hoorde niets. Tik nog eens.' : 'Inspreken lukt nu niet. Gebruik de microfoon van je toetsenbord.'); };
    herkenner.onend = () => { luistert = false; const k = $('[data-doe="dicteer"]'); if (k) k.textContent = 'Inspreken als tekst'; };
    herkenner.start(); luistert = true;

/* ---------- wat oefen ik? ---------- */
function laatsteUitkomst(o){ const s = (o.sessies || []).filter(x => x.uitkomst !== 'niet'); return s.length ? s[s.length-1] : null; }
function kandidaten(disc, pid){
  if (!disc || disc === 'vrij') return [];
  const projs = actieveProjecten().filter(p => pid ? p.id === pid : p.disc === disc);
  const lijst = [];
  projs.forEach(p => {
    const vm = volgendeMijlpaal(p);
    const inVm = new Set(vm ? scopeVan(p, vm).filter(o => o.status < vm.min).map(o => o.id) : []);
    p.onderdelen.forEach((o, n) => {
      if (o.status >= topStatus(p)) return;
      const lu = laatsteUitkomst(o);
      const prio = lu && lu.uitkomst === 'stroef' ? 0 : inVm.has(o.id) ? 1 : 2;
      lijst.push({ pid:p.id, oid:o.id, prio, status:o.status, laatst: lu ? lu.ts : 0, n });
    });
  });
  lijst.sort((a,b) => a.prio - b.prio || a.status - b.status || a.laatst - b.laatst || a.n - b.n);
  if (lijst.length) return lijst;
  if (pid) return [];
  const soort = discSoort(disc);
  return S.ideeen.filter(i => i.status === 'bak' && i.verder && ideeSoort(i) === soort)
    .sort((a,b) => (a.gezien || a.gemaakt) - (b.gezien || b.gemaakt)).map(i => ({ ideeId:i.id }));
}

async function verklein(bestand){
  try {
    const bm = await createImageBitmap(bestand);
    const f = Math.min(1, 1600 / Math.max(bm.width, bm.height));
    const c = document.createElement('canvas'); c.width = Math.round(bm.width * f); c.height = Math.round(bm.height * f);
    c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
    return await new Promise(ok => c.toBlob(b => ok(b || bestand), 'image/jpeg', 0.82));
  } catch(e) { return bestand; }
}

/* ---------- projecten maken ---------- */
function leesLijst(tekst, groepNaam){
  const groepen = []; let cur = null;
  String(tekst || '').split(/\r?\n/).forEach(r => {
    const t = r.trim();
    if (!t) { if (cur && cur.items.length) cur = null; return; }
    if (t.endsWith(':') && t.length > 1) { cur = { naam:t.slice(0,-1).trim(), items:[] }; groepen.push(cur); return; }
    if (!cur) { cur = { naam:null, items:[] }; groepen.push(cur); }
    const n = t.replace(/^(\d+[.)]\s*|[-•*]\s+)/, '').trim(); if (n) cur.items.push(n);
  });
  const vol = groepen.filter(g => g.items.length || g.naam);
  if (vol.length === 1 && !vol[0].naam) return { groepen:[], items:vol[0].items.map(n => ({ naam:n, groep:null })) };
  const uit = { groepen:[], items:[] }; let teller = 0;
  vol.forEach(g => { teller++; const gid = nieuwId(); uit.groepen.push({ id:gid, naam:g.naam || (groepNaam + ' ' + teller) }); g.items.forEach(n => uit.items.push({ naam:n, groep:gid })); });
  return uit;
}
function nieuwDeel(naam, groep){ return { id:nieuwId(), naam, groep:groep || null, status:0, links:[], noot:'', duur:null, sessies:[] }; }
function maakProject(c){
  const sj = SJABLONEN[c.sjabloon] || SJABLONEN.leeg;
  const lijst = leesLijst(c.lijst, sj.groep);
  return {
    id:nieuwId(), naam:c.naam.trim() || 'Nieuw project', sjabloon:c.sjabloon, disc:c.disc,
    statussen:sj.statussen.slice(), groepen:lijst.groepen, onderdelen:lijst.items.map(x => nieuwDeel(x.naam, x.groep)),
    mijlpalen:[], duur:sj.duur, durf:!!c.durf,
    ladder:(sj.soort === 'comedy' ? LADDER.comedy : LADDER.standaard).map(t => ({ t, gedaan:false })),
    status:'actief', gemaakt:nu(), afgerond:null, terugblik:'', terugblikMedia:null
  };
}

/* ---------- bouwstenen ---------- */
function terugLink(label){ return `<button type="button" class="terugl" data-doe="terug">${ICOON.terug}${esc(label)}</button>`; }
function onder(inner){ return `<div class="onder"><div class="binnen">${inner}</div></div>`; }
function pil(p, idx){
  const top = topStatus(p), k = kleur(projectSoort(p)), naam = esc(p.statussen[idx] ?? '?');
  if (idx >= top) return `<span class="pil" style="background:${k};color:#17181D">${naam}</span>`;
  if (idx <= 0) return `<span class="pil" style="border:1.5px dashed var(--dof);color:var(--stil2)">${naam}</span>`;
  return `<span class="pil" style="border:1.5px solid ${k}">${naam}</span>`;
}
function mediaVan(i){
  if (i.mediaSoort === 'audio' && i.media) return speelKnop(i.media);
  if (i.mediaSoort === 'foto' && i.media) return `<img class="duim" data-foto="${esc(i.media)}" alt="">`;
  return `<span class="letter" style="color:${kleur(ideeSoort(i))}">${esc((i.soort ? IDEESOORT[i.soort].naam : 'T').charAt(0))}</span>`;
}
function ideeSub(i){
  const d = [];
  if (i.soort) d.push(klein1(IDEESOORT[i.soort].naam));
  if (i.mediaSoort === 'audio') d.push('opname ' + sec(i.duur)); else if (i.mediaSoort === 'foto') d.push('foto');
  d.push(rel(i.gemaakt));
  const p = i.pid && vindProject(i.pid); if (p) d.push('bij ' + p.naam);
  if (i.verder) d.push('verder mee');
  const r = rustTekst(i); if (r) d.push(r);
  return d.join(' · ');
}
function ideeRij(i){
  return `<div class="r">${mediaVan(i)}<a class="wat" href="#idee/${esc(i.id)}" style="text-decoration:none;min-height:44px;justify-content:center"><b>${esc(ideeTitel(i))}</b><span>${esc(ideeSub(i))}</span></a></div>`;
}
function niets(t){ return terugLink('Terug') + `<p class="leeg">${esc(t)}</p>`; }
function veldLabel(id, t){ return `<label class="label" for="${id}">${esc(t)}</label>`; }
let ideeRust = false, kies = null, np = null, afrTekst = '', groepOpen = new Set(), laatstGetekend = null;

const SCHERM = {};

/* ---------- start ---------- */
SCHERM.start = () => {
  const bak = uitDeBak();
  const ideeen = inBak();
  const grappen = ideeen.filter(i => i.soort === 'grap').length;
  let h = `<div class="kop"><h1>Atelier</h1><a class="icoonknop" href="#instellingen" aria-label="Instellingen">${ICOON.instel}</a></div>`;
  if (S.sessie) h += `<a class="kaart" href="#${S.sessie.klaar ? 'na' : 'sessie'}" style="border:2px solid var(--amber)"><b>${S.sessie.klaar ? 'Je sessie is klaar' : 'Er loopt een sessie'}</b><span class="stil fijn">${esc(discNaam(S.sessie.disc))} · ${S.sessie.min} min · tik om verder te gaan</span></a>`;
  if (bak) h += bakKaart(bak);
  const laatste = ideeen.slice().sort((a,b) => b.gemaakt - a.gemaakt)[0];
  h += `<a class="kaart" href="#bak" style="gap:4px"><div class="kop"><h2>Ideeën</h2><span class="stil fijn">${ideeen.length}</span></div><span class="stil fijn">${
    laatste ? (grappen ? 'waarvan ' + grappen + (grappen === 1 ? ' grap' : ' grappen') + ' · ' : '') + 'laatste: ' + esc(ideeTitel(laatste)) + ', ' + rel(laatste.gemaakt) : 'Nog leeg. Tik op Vang als er iets opkomt.'}</span></a>`;
  let volgende = null;
  for (const d of S.disciplines) { const k = kandidaten(d.id)[0]; if (k) { volgende = 'Volgende op ' + klein1(d.naam) + ': ' + focusNaam(k); break; } }
  h += `<a class="kaart" href="#speel" style="gap:4px"><h2>Oefenen</h2><span class="stil fijn">${esc(volgende || 'Kies wat je speelt, ik stel een sessie voor.')}</span></a>`;
  const act = actieveProjecten();
  h += `<div class="kaart"><div class="kop"><h2>Projecten</h2><a href="#projecten" class="stil fijn" style="min-height:44px;display:flex;align-items:center;text-decoration:none">Alle projecten</a></div>`;
  if (!act.length) h += `<span class="stil fijn">Nog geen projecten. <a href="#nieuw">Start er een</a> als je wil.</span>`;
  else h += `<div class="lijst">` + act.slice(0,4).map(p => {
    const mr = mijlpaalRegel(p);
    return `<a class="r" href="#project/${esc(p.id)}"><span class="stip" style="background:${kleur(projectSoort(p))}"></span><span class="wat"><b>${esc(p.naam)}</b><span>${esc(mr ? mr.tekst : p.onderdelen.length + ' ' + sjab(p).meer)}</span></span></a>`;
  }).join('') + `</div>`;
  h += `</div>`;
  h += onder(`<button type="button" class="knop amber groot" data-doe="vang">${ICOON.mic} Vang</button><a class="knop lijn2 groot" href="#speel" style="background:none;color:var(--inkt)">${ICOON.noot} Ik speel</a>`);
  return h;
};
function bakKaart(i){
  const media = i.mediaSoort === 'audio' && i.media ? speelKnop(i.media, true) : i.mediaSoort === 'foto' && i.media ? `<img class="duim" data-foto="${esc(i.media)}" alt="">` : '';
  const sub = [i.soort ? IDEESOORT[i.soort].naam : '', i.mediaSoort === 'audio' ? sec(i.duur) : '', (i.pid && vindProject(i.pid)) ? 'bij ' + vindProject(i.pid).naam : ''].filter(Boolean).join(' · ');
  const oud = rel(i.gemaakt);
  let h = `<div class="kaart bak"><div class="label warm">Uit de bak · ${esc(oud === 'vandaag' ? 'van vandaag' : oud + ' oud')}</div>
    <div class="rij" style="gap:12px">${media}<div style="flex:1;min-width:0"><b style="font-size:17px;overflow-wrap:anywhere">${esc(ideeTitel(i))}</b>${sub ? `<div class="stil klein">${esc(sub)}</div>` : ''}</div></div>`;
  if (bakRust) h += `<div class="label">Laat rusten tot</div><div class="drie"><button type="button" class="knop rand mini" data-doe="rust" data-waar="bak" data-id="${esc(i.id)}" data-dagen="7">Een week</button><button type="button" class="knop rand mini" data-doe="rust" data-waar="bak" data-id="${esc(i.id)}" data-dagen="30">Een maand</button><button type="button" class="knop rand mini" data-doe="rust" data-waar="bak" data-id="${esc(i.id)}" data-dagen="90">3 maanden</button></div><button type="button" class="tekstknop" data-doe="annuleerrust">Toch niet</button>`;
  else h += `<div class="drie"><button type="button" class="knop mini" data-doe="bakverder" data-id="${esc(i.id)}">Verder mee</button><button type="button" class="knop rand mini" data-doe="bakrust">Laat rusten</button><button type="button" class="knop rand mini" data-doe="baklos" data-id="${esc(i.id)}">Laat los</button></div>`;
  return h + `</div>`;
}

/* ---------- ideeënbak ---------- */
SCHERM.bak = (f) => {
  f = f || 'alles';
  if (f === 'los') {
    const los = S.ideeen.filter(i => i.status === 'los').sort((a,b) => b.gemaakt - a.gemaakt);
    return terugLink('Ideeën') + `<h1>Losgelaten</h1><p class="stil fijn" style="margin:0">Losgelaten ideeën komen niet meer terug. Open er een om het terug in de bak te zetten of definitief te wissen.</p>` +
      (los.length ? `<div class="kaart"><div class="lijst">${los.map(ideeRij).join('')}</div></div>` : `<p class="leeg">Niets losgelaten.</p>`);
  }
  const alle = inBak();
  const lijst = alle.filter(i => f === 'alles' || ideeSoort(i) === f).sort((a,b) => (b.verder ? 1 : 0) - (a.verder ? 1 : 0) || b.gemaakt - a.gemaakt);
  const nLos = S.ideeen.filter(i => i.status === 'los').length;
  const uitleg = S.uitDeBak === 'uit' ? 'Niets hier moet.' : S.uitDeBak === 'dag' ? 'Niets hier moet. Elke dag haal ik er één oud idee uit de bak.' : 'Niets hier moet. Elke keer dat je het atelier opent, haal ik er één oud idee uit de bak.';
  let h = terugLink('Atelier') + `<div class="kop"><h1>Ideeën</h1><span class="stil">${alle.length}</span></div><p class="stil fijn" style="margin:0">${uitleg}</p>`;
  h += `<div class="chips">` + [['alles','Alles'],['muziek','Muziek'],['comedy','Comedy'],['schrijven','Schrijven'],['overig','Overig']].map(([k,n]) => `<button type="button" class="chip" data-doe="filter" data-w="${k}" aria-pressed="${f === k}">${n}</button>`).join('') + `</div>`;
  h += lijst.length ? `<div class="kaart" style="padding:4px 14px"><div class="lijst">${lijst.map(ideeRij).join('')}</div></div>` : `<p class="leeg">${alle.length ? 'Niets in deze soort.' : 'De bak is nog leeg. Alles wat je vangt, komt hier: een riff, een grap, een zin, een foto van een notitie.'}</p>`;
  if (nLos) h += `<a class="tekstknop" href="#bak/los" style="align-self:flex-start;display:inline-flex;align-items:center">Losgelaten (${nLos})</a>`;
  h += onder(`<button type="button" class="knop amber groot" data-doe="vang">${ICOON.mic} Iets nieuws vangen</button>`);
  return h;
};

SCHERM.idee = (id) => {
  const i = vindIdee(id); if (!i) return niets('Dit idee bestaat niet meer.');
  let h = terugLink('Ideeën');
  if (i.mediaSoort === 'audio' && i.media) h += `<div class="opname klein">${speelKnop(i.media, true)}<div style="flex:1"><b>Opname ${sec(i.duur)}</b><div class="stil klein">gevangen ${esc(relZin(i.gemaakt))}</div></div></div>`;
  if (i.mediaSoort === 'foto' && i.media) h += `<img class="foto-groot" data-foto="${esc(i.media)}" alt="${esc(ideeTitel(i))}">`;
  h += veldLabel('idee-tekst', i.media ? 'Naam of tekst · mag leeg' : 'Tekst');
  h += `<textarea class="veld" id="idee-tekst" rows="3" data-in="idee-tekst" placeholder="${esc(ideeTitel(i))}">${esc(i.tekst)}</textarea>`;
  if (kanSpraak()) h += `<button type="button" class="tekstknop" style="align-self:flex-start;margin-top:-8px" data-doe="dicteer" data-veld="idee-tekst">Inspreken als tekst</button>`;
  h += `<div class="label">Wat is het?</div><div class="chips">` + Object.entries(IDEESOORT).map(([k,v]) => `<button type="button" class="chip" data-doe="ideesoort" data-w="${k}" aria-pressed="${i.soort === k}">${v.naam}</button>`).join('') + `</div>`;
  const projs = S.projecten.filter(p => p.status === 'actief' || p.id === i.pid);
  h += veldLabel('idee-project', 'Bij een project?') + `<select class="veld" id="idee-project" data-ch="idee-project"><option value="">Nee, gewoon de bak</option>${projs.map(p => `<option value="${esc(p.id)}"${p.id === i.pid ? ' selected' : ''}>${esc(p.naam)}</option>`).join('')}</select>`;
  const p = i.pid && vindProject(i.pid);
  if (p && p.onderdelen.length) h += veldLabel('idee-deel', 'Bij welk ' + sjab(p).onderdeel + '?') + `<select class="veld" id="idee-deel" data-ch="idee-deel"><option value="">Bij het hele project</option>${p.onderdelen.map(o => `<option value="${esc(o.id)}"${o.id === i.oid ? ' selected' : ''}>${esc(o.naam)}</option>`).join('')}</select>`;
  h += veldLabel('idee-noot', 'Notitie · mag leeg') + `<textarea class="veld" id="idee-noot" rows="2" data-in="idee-noot">${esc(i.noot || '')}</textarea>`;
  const info = ['gevangen ' + relZin(i.gemaakt), rustTekst(i)].filter(Boolean).join(' · ');
  h += `<div class="stil klein">${esc(info)}</div>`;
  if (i.status === 'los') {
    h += `<div class="twee"><button type="button" class="knop" data-doe="ideeterug" data-id="${esc(i.id)}">Terug in de bak</button><button type="button" class="knop rand" data-doe="ideewis" data-id="${esc(i.id)}">Definitief wissen</button></div>`;
  } else if (ideeRust) {
    h += `<div class="label">Laat rusten tot</div><div class="drie"><button type="button" class="knop rand mini" data-doe="rust" data-id="${esc(i.id)}" data-dagen="7">Een week</button><button type="button" class="knop rand mini" data-doe="rust" data-id="${esc(i.id)}" data-dagen="30">Een maand</button><button type="button" class="knop rand mini" data-doe="rust" data-id="${esc(i.id)}" data-dagen="90">3 maanden</button></div><button type="button" class="tekstknop" style="align-self:flex-start" data-doe="annuleerrust">Toch niet</button>`;
  } else {
    h += `<div class="drie"><button type="button" class="knop mini${i.verder ? '' : ' rand'}" data-doe="ideeverder" data-id="${esc(i.id)}" aria-pressed="${!!i.verder}">${i.verder ? ICOON.vink + ' Verder mee' : 'Verder mee'}</button><button type="button" class="knop rand mini" data-doe="ideerust">Laat rusten</button><button type="button" class="knop rand mini" data-doe="ideelos" data-id="${esc(i.id)}">Laat los</button></div>`;
    h += `<div class="stil klein">${i.verder ? 'Dit idee kan als focus terugkomen bij Ik speel (' + esc(klein1(SOORT[ideeSoort(i)].naam)) + '), als er geen projectwerk klaarstaat.' : 'Verder mee: het idee kan als focus terugkomen in je oefensessies.'}</div>`;
  }
  return h;
};

/* ---------- vangen ---------- */
SCHERM.vang = (pid, oid) => {
  if (!vc) vc = nieuweVangst(pid, oid);
  let h = terugLink('Terug') + `<h1>Vang</h1>`;
  h += `<div class="seg" role="group" aria-label="Soort vangst">${[['opname','Opname'],['tekst','Tekst'],['foto','Foto']].map(([k,n]) => `<button type="button" data-doe="modus" data-m="${k}" aria-pressed="${vc.modus === k}">${n}</button>`).join('')}</div>`;
  if (vc.modus === 'opname') {
    h += `<div class="opname" id="opname-vak" data-ctx="vang">${opnameInhoud('vang')}</div>`;
    h += `<input class="veld" id="vang-tekst" data-in="vang-tekst" value="${esc(vc.tekst)}" placeholder="Naam, mag leeg" aria-label="Naam van de opname">`;
  } else if (vc.modus === 'tekst') {
    h += `<textarea class="veld" id="vang-tekst" rows="4" data-in="vang-tekst" placeholder="Een grap, een zin, een titel, een plan…" aria-label="Tekst">${esc(vc.tekst)}</textarea>`;
    if (kanSpraak()) h += `<button type="button" class="tekstknop" style="align-self:flex-start;margin-top:-8px" data-doe="dicteer" data-veld="vang-tekst">Inspreken als tekst</button>`;
  } else {
    h += vc.fotoUrl ? `<img class="foto-groot" src="${vc.fotoUrl}" alt="Je foto"><button type="button" class="tekstknop" style="align-self:flex-start" data-doe="kiesfoto">Andere foto</button>`
      : `<button type="button" class="opname" style="border:0;color:var(--inkt);width:100%" data-doe="kiesfoto"><span class="rond">${ICOON.foto}</span><span class="stil fijn">Neem een foto van een notitie, een setlist, een idee op papier.</span></button>`;
    h += `<input class="veld" id="vang-tekst" data-in="vang-tekst" value="${esc(vc.tekst)}" placeholder="Naam, mag leeg" aria-label="Naam van de foto">`;
  }
  h += `<div class="label">Wat is het? · mag leeg blijven</div><div class="chips">` + Object.entries(IDEESOORT).map(([k,v]) => `<button type="button" class="chip" data-doe="vangsoort" data-w="${k}" aria-pressed="${vc.soort === k}">${v.naam}</button>`).join('') + `</div>`;
  const act = actieveProjecten();
  if (act.length) {
    h += `<div class="label">Bij een project?</div><div class="chips"><button type="button" class="chip" data-doe="vangproject" data-id="" aria-pressed="${!vc.pid}">Nee, gewoon de bak</button>` + act.map(p => `<button type="button" class="chip" data-doe="vangproject" data-id="${esc(p.id)}" aria-pressed="${vc.pid === p.id}"><span class="stip" style="width:8px;height:8px;background:${kleur(projectSoort(p))}"></span>${esc(p.naam)}</button>`).join('') + `</div>`;
    const o = vc.oid && vindDeel(vindProject(vc.pid), vc.oid); if (o) h += `<div class="stil klein">bij ${esc(o.naam)}</div>`;
  }
  h += onder(`<button type="button" class="knop amber groot" data-doe="bewaar">Bewaar</button>`);
  return h;
};

/* ---------- oefenen ---------- */
function huidigeFocus(){
  if (kies.oid && kies.pid && vindDeel(vindProject(kies.pid), kies.oid)) return { pid:kies.pid, oid:kies.oid };
  const l = kandidaten(kies.disc, kies.pid); if (!l.length) return null;
  const k = l[kies.alt % l.length]; return k.ideeId ? { ideeId:k.ideeId } : { pid:k.pid, oid:k.oid };
}
SCHERM.speel = (a, b, c) => {
  if (!kies || kies.route !== location.hash) {
    let disc = a || S.laatsteDisc || (S.disciplines[0] && S.disciplines[0].id) || 'vrij';
    if (disc !== 'vrij' && !vindDisc(disc)) disc = (S.disciplines[0] && S.disciplines[0].id) || 'vrij';
    kies = { route:location.hash, disc, min:S.laatsteMin || 30, pid:b || null, oid:c || null, alt:0 };
  }
  let h = terugLink('Atelier') + `<h1>Ik speel</h1><div class="label">Wat wordt het?</div><div class="tegels">`;
  h += S.disciplines.map(d => { const k = kandidaten(d.id)[0]; return `<button type="button" class="tegel" data-doe="kiesdisc" data-id="${esc(d.id)}" aria-pressed="${kies.disc === d.id}"><b><span class="stip" style="width:8px;height:8px;background:${kleur(d.soort)};margin-right:6px;vertical-align:middle"></span>${esc(d.naam)}</b><span>${esc(k ? 'Volgende: ' + focusNaam(k) : 'Vrij')}</span></button>`; }).join('');
  h += `<button type="button" class="tegel" data-doe="kiesdisc" data-id="vrij" aria-pressed="${kies.disc === 'vrij'}"><b>Zonder doel</b><span>Gewoon spelen</span></button></div>`;
  h += `<div class="label">Hoe lang?</div><div class="drie">` + [15,30,45].map(m => `<button type="button" class="chip" style="justify-content:center;border-radius:12px;min-height:44px" data-doe="kiesmin" data-w="${m}" aria-pressed="${kies.min === m}">${m} min</button>`).join('') + `</div>`;
  const f = kies.disc === 'vrij' ? null : huidigeFocus();
  const s = bouwSessie(kies.disc, kies.min, f);
  const p = kies.pid && vindProject(kies.pid);
  const aantal = kies.oid ? 1 : kandidaten(kies.disc, kies.pid).length;
  h += `<div class="kaart"><div><b>Jouw sessie${p ? ' voor ' + esc(p.naam) : ''}:</b> <span class="stil2">${esc(sessieZin(s))}</span></div>`;
  if (f && f.oid) { const o = vindDeel(vindProject(f.pid), f.oid); const lu = o && laatsteUitkomst(o); if (lu && lu.uitkomst === 'stroef') h += `<div class="stil klein">${esc(o.naam)} ging vorige keer stroef, daarom komt het terug.</div>`; }
  if (aantal > 1) h += `<button type="button" class="tekstknop" style="align-self:flex-start" data-doe="andersfocus">Iets anders als focus</button>`;
  if (!f && kies.disc !== 'vrij') h += `<div class="stil klein">Geen projectwerk of idee om verder mee te gaan. Dat is prima: dan wordt het vrij spelen.</div>`;
  h += `</div>`;
  h += onder(`<button type="button" class="knop amber groot" data-doe="begin">Begin</button>`);
  return h;
};
function stapMinuten(s){ return Math.floor((nu() - s.stapStart) / 60000); }
SCHERM.sessie = () => {
  const s = S.sessie;
  if (!s) { vervang('#start'); return null; }
  if (s.klaar) { vervang('#na'); return null; }
  const fs = focusStap(s), p = fs && fs.pid && vindProject(fs.pid), ca = p && aftellen(p);
  let h = `<div><div class="label">${esc(discNaam(s.disc))} · ${s.min} min</div>${p ? `<div class="stil fijn" style="margin-top:4px">${esc(p.naam)}${ca ? ' · nog ' + ca.getal + ' ' + ca.eenheid : ''}</div>` : ''}</div>`;
  h += s.stappen.map((x, n) => {
    if (n < s.i) return `<div class="stap af"><span style="color:var(--stil)">${ICOON.vink}</span><b style="flex:1">${esc(x.titel)}</b><span class="stil klein">${x.min} min</span></div>`;
    if (n > s.i) return `<div class="stap later"><b style="flex:1">${esc(x.titel)}</b><span class="stil klein">${x.min} min</span></div>`;
    const m = stapMinuten(s);
    let extra = '';
    if (x.oid) { const o = vindDeel(vindProject(x.pid), x.oid); if (o && o.links.length) extra = `<div class="chips">${o.links.map(l => `<a class="knop rand mini" href="${esc(l.url)}" target="_blank" rel="noopener">${ICOON.link} ${esc(l.naam)}</a>`).join('')}</div>`; }
    if (x.ideeId) { const i = vindIdee(x.ideeId); if (i && i.mediaSoort === 'audio' && i.media) extra = `<div class="rij">${speelKnop(i.media)}<span class="stil fijn">Beluister het idee (${sec(i.duur)})</span></div>`; }
    return `<div class="stap nu"><div class="label warm">Nu${x.soort === 'focus' ? ' · focus' : ''}</div><b style="font-size:20px;font-family:var(--titel)">${esc(x.titel)}</b><div class="fijn" style="color:var(--stil2);line-height:1.45">${esc(x.uitleg)}</div>
      <div class="rij" style="align-items:baseline"><span class="groot-getal" id="stap-min" style="font-size:30px">${m}</span><span class="stil">van ${x.min} min</span><span class="stil klein" id="stap-om" style="margin-left:auto">${m >= x.min ? 'tijd om, ga verder als je wil' : ''}</span></div>
      <div class="balk"><i id="stap-balk" style="width:${Math.min(100, m / x.min * 100)}%"></i></div>${extra}</div>`;
  }).join('');
  h += `<div class="opname klein" id="opname-vak" data-ctx="sessie">${opnameInhoud('sessie')}</div>`;

SCHERM.instellingen = () => {

    <div class="rij"><input class="veld" id="disc-naam" placeholder="bv. Piano" aria-label="Nieuwe discipline"><select class="veld" id="disc-soort" style="width:auto" aria-label="Soort">${Object.entries(SOORT).map(([k,v]) => `<option value="${k}">${v.naam}</option>`).join('')}</select></div>

    <div class="rij" style="min-height:56px;border-top:1px solid var(--lijn2)"><span style="flex:1;display:flex;flex-direction:column"><span>Opnames en foto's</span><span class="stil klein">groter bestand · ${nMedia} ${nMedia === 1 ? 'stuk' : 'stuks'} · ${S.laatsteMediaBackup ? 'laatst ' + esc(datumKort(dagSleutel(S.laatsteMediaBackup))) : 'nog nooit'}</span></span><button type="button" class="knop rand mini" data-doe="backupmedia">Back-up</button></div>

  h += `<p class="stil klein" style="margin:0">Atelier versie 1 · gegevens onder ‘${OPSLAG}’ in Chrome</p>`;

function teken(){
  const [r, a, b, c] = route();
  const naam = SCHERM[r] ? r : 'start';
  const html = SCHERM[naam](a, b, c);
  if (html === null) return;
  $('#app').innerHTML = html;
  if (location.hash !== laatstGetekend) { window.scrollTo(0, 0); laatstGetekend = location.hash; }
  vorigeRoute = naam;
  vulFotos();
}

/* ---------- acties ---------- */
function hierProject(){ return vindProject(route()[1]); }
function hierDeel(){ return vindDeel(vindProject(route()[1]), route()[2]); }
function hierIdee(){ return vindIdee(route()[1]); }
function download(obj, naam){
  const blob = new Blob([JSON.stringify(obj)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = naam;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function naarDataUrl(blob){ return new Promise((ok, nok) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => nok(r.error); r.readAsDataURL(blob); }); }

const DOE = {

  ideelos: d => { const i = vindIdee(d.id); if (!i) return; const t = momentopname(); i.status = 'los'; i.verder = false; bewaar(); toast('Losgelaten.', t); terug(); },

  pdisc: d => { const p = hierProject(); if (!p) return; p.disc = d.id; bewaar(); teken(); },

    p.mijlpalen.forEach(m => { if (m.min != null) m.min = Math.min(pas(m.min), topStatus(p)); });

  mpweg: d => { const p = hierProject(); if (!p) return; const t = momentopname(); p.mijlpalen = p.mijlpalen.filter(x => x.id !== d.id); bewaar(); toast('Mijlpaal geschrapt.', t); teken(); },

  'deel-naam': v => { const o = hierDeel(); if (o && v.trim()) { o.naam = v.trim(); bewaar(); } },
  'deel-noot': v => { const o = hierDeel(); if (o) { o.noot = v; bewaar(); } },
  'deel-duur': v => { const o = hierDeel(); if (o) { const n = parseInt(v, 10); o.duur = n > 0 ? n : null; bewaar(); } },
  'p-naam': v => { const p = hierProject(); if (p && v.trim()) { p.naam = v.trim(); bewaar(); } },
  'status': (v, el) => { const p = hierProject(); if (p && v.trim()) { p.statussen[+el.dataset.n] = v.trim(); bewaar(); } },
  'groep-naam': (v, el) => { const p = hierProject(), g = p && p.groepen.find(x => x.id === el.dataset.id); if (g && v.trim()) { g.naam = v.trim(); bewaar(); } },
  'mp-wat': (v, el) => { const p = hierProject(), m = p && p.mijlpalen.find(x => x.id === el.dataset.id); if (m) { m.wat = v.trim(); bewaar(); } },
  'terugblik': v => { afrTekst = v; }
};
/* ---------- keuzes die het scherm hertekenen ---------- */
const CH = {
  'idee-project': v => { const i = hierIdee(); if (i) { i.pid = v || null; i.oid = null; } },
  'idee-deel': v => { const i = hierIdee(); if (i) i.oid = v || null; },
  'np-durf': (v, el) => { if (np) np.durf = el.checked; },
  'omhoog': (v, el) => { if (S.sessie) S.sessie.na.omhoog = el.checked; },
  'deel-groep': v => { const o = hierDeel(); if (o) o.groep = v || null; },
  'mp-datum': (v, el) => { const p = hierProject(), m = p && p.mijlpalen.find(x => x.id === el.dataset.id); if (m && v) m.datum = v; },
  'mp-groep': (v, el) => { const p = hierProject(), m = p && p.mijlpalen.find(x => x.id === el.dataset.id); if (m) m.groep = v || null; },
  'mp-min': (v, el) => { const p = hierProject(), m = p && p.mijlpalen.find(x => x.id === el.dataset.id); if (m) m.min = v === '' ? null : +v; },
  'p-duur': (v, el) => { const p = hierProject(); if (p) p.duur = el.checked; },
  'p-durf': (v, el) => { const p = hierProject(); if (p) p.durf = el.checked; },
  'trede': (v, el) => { const p = hierProject(); if (p && p.ladder[+el.dataset.n]) p.ladder[+el.dataset.n].gedaan = el.checked; },
  'schermaan': (v, el) => { S.schermAan = el.checked; if (!el.checked) laatLos(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-doe]'); if (!el) return;
  const f = DOE[el.dataset.doe]; if (f) { e.preventDefault(); f(el.dataset, el); }
});
document.addEventListener('input', e => { const t = e.target, k = t.dataset && t.dataset.in; if (k && IN[k]) IN[k](t.value, t); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'nieuw-deel') { e.preventDefault(); DOE.deelerbij(); }
  if (e.target.id === 'disc-naam') { e.preventDefault(); DOE.discerbij(); }
  if (e.target.id === 'link-url') { e.preventDefault(); DOE.linkerbij(); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'foto-in' && t.files && t.files[0]) {
    const blob = await verklein(t.files[0]); t.value = '';
    if (!vc) vc = nieuweVangst();
    if (vc.fotoUrl) URL.revokeObjectURL(vc.fotoUrl);
    vc.foto = blob; vc.fotoUrl = URL.createObjectURL(blob); vc.modus = 'foto';
    if (route()[0] === 'vang') teken(); else ga('#vang');
    return;
  }
  if (t.id === 'bestand' && t.files && t.files[0]) {
    const bestand = t.files[0]; t.value = '';
    let j; try { j = JSON.parse(await bestand.text()); } catch(err) { toast('Dit bestand is geen back-up van het Atelier.'); return; }
    if (!j || j.app !== 'atelier') { toast('Dit bestand is geen back-up van het Atelier.'); return; }
    if (j.deel === 'tekst' && j.data && Array.isArray(j.data.ideeen)) {
      if (!confirm('Je huidige ideeën en projecten vervangen door deze back-up?')) return;
      S = Object.assign(startToestand(), j.data, { sessie:null }); bewaar(); bakDezeKeer = null;
      toast('Teruggezet: ' + S.ideeen.length + ' ideeën en ' + S.projecten.length + ' projecten.'); vervang('#start'); return;
    }
    if (j.deel === 'media' && Array.isArray(j.items)) {
      let n = 0;
      for (const it of j.items) { try { const blob = await (await fetch(it.data)).blob(); await MEDIA.put({ id:it.id, blob, type:it.type || blob.type, gemaakt:it.gemaakt || nu() }); n++; } catch(err) {} }
      toast(n + ' opnames en foto\'s teruggezet.'); teken(); return;
    }
    toast('Dit bestand is geen back-up van het Atelier.'); return;
  }
  const k = t.dataset && t.dataset.ch; if (!k || !CH[k]) return;
  CH[k](t.value, t); bewaar(); teken();
});

/* ---------- starten ---------- */
laad();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e) {}
if (S.sessie && !/^#(sessie|na)$/.test(location.hash)) history.replaceState(null, '', S.sessie.klaar ? '#na' : '#sessie');
if (!location.hash) history.replaceState(null, '', '#start');
stapel = [location.hash];
teken();
houdAan();
setInterval(() => { if (rec.staat === 'neemt') { const t = $('#opname-tijd'); if (t) t.textContent = sec((nu() - rec.start) / 1000); } }, 500);
setInterval(tikSessie, 10000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  houdAan();
  const r = route()[0];
  if (r === 'sessie') tikSessie();
  if (r === 'start') teken();
});
</script>
</body>
</html>
